services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-api-gateway
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - APP_ENV=production
      - GOMAXPROCS=1          # sama dengan jumlah core yang dipin
      - GOMEMLIMIT=200MiB     # ~80% dari limit, agar GC bekerja sebelum OOM-kill
    volumes:
      - ./configs:/configs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cpuset: "0"
    mem_limit: 256m
    memswap_limit: 256m       # matikan swap, supaya OOM terlihat jujur
    restart: "no"             # selama uji, agar OOM/crash tidak tertutup restart otomatis

  mock-server:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-server
    ports:
      - "9090:9090"
    environment:
      - GOMAXPROCS=1
      - GOMEMLIMIT=200MiB
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cpuset: "1"
    mem_limit: 256m
    memswap_limit: 256m

  k6:
    image: grafana/k6:latest
    container_name: k6-load-test
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workdir
    depends_on:
      - api-gateway
    environment:
      - TARGET_URL=http://api-gateway:8080
      - GOMEMLIMIT=2500MiB    # ~80% dari limit, GC bekerja sebelum OOM-kill
      - PRE_VUS=1500          # VU ~0.3MB -> ~0.5GB; host hanya 5.6GB RAM
      - MAX_VUS=6000          # ~1.8GB worst-case; agar k6 tidak ikut OOM sebelum summary ditulis
    volumes:
      - ./performance:/scripts
      - .:/workdir
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cpuset: "2,3"
    mem_limit: 3g
    memswap_limit: 3g         # total k6+gateway+mock ~3.5GB dari 5.6GB host, sisakan headroom OS
    command: run /scripts/load-test.js
