# Config A — gateway without authentication (baseline)
server:
  proxy_port: 8080
  admin_port: 8081
  log_level: warn        # minimize logging overhead during perf tests
global_plugins:
  - name: metrics
    enabled: false
  - name: logger
    enabled: false
  - name: cors
    enabled: false
upstreams:
  - id: upstream-mock
    name: mock-upstream
    algorithm: round-robin
    targets:
      - host: mock-server
        port: 9090
        weight: 100
        health_check:
          path: /health
          interval: 30s
services:
  - id: svc-test-001
    name: test-service
    upstream_id: upstream-mock
    protocol: http
    timeout: 30
    connect_timeout: 5
    read_timeout: 30
    retries: 0

routes:
  - id: route-users-001
    name: users-route
    methods: [GET, POST, OPTIONS]
    paths: [/api/v1/users]
    service_id: svc-test-001

  - id: route-health-001
    name: health-route
    methods: [GET]
    paths: [/health]
    service_id: svc-test-001

  - id: route-echo-001
    name: echo-route
    methods: [GET, POST, PUT]
    paths: [/echo]
    service_id: svc-test-001

  - id: route-rate-001
    name: rate-route
    methods: [GET]
    paths: [/rate/users]
    service_id: svc-test-001
